---
title: Our Wild Spaces 2.0
description: "Information about the various terrestrial habitats in Singapore with an interactive map"
---
{% include global/header.html %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet-providers@latest/leaflet-providers.js"></script>
<style>
.page-content{
    padding-top:0;
}
.bold{
    font-weight: bold;
}

.habitat-popup p{
    margin:0.5rem 0;
}
.habitat-popup img{
    width:100%;
    height:150px;
    margin-bottom:0.5rem;
    object-fit: cover;
    object-position: center;
}
.habitat-popup-preview{
    position:relative;
    margin:0 -1rem 0;
    overflow:hidden;
}
.habitat-popup-preview img{
    display:block;
    height:180px;
    max-height:600px;
    margin:0;
}
.habitat-popup-preview h3{
    position:absolute;
    right:0;
    bottom:0;
    left:0;
    margin:0;
    padding:3rem 1rem 0.75rem;
    color:#F7F1DE;
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    line-height:1.1;
    background:linear-gradient(transparent, rgba(50, 71, 18, 0.82));
}
.habitat-popup-title{
    margin:0;
    color:#324712;
    font-family:'DM Sans', sans-serif;
    font-weight:700;
}

#map.loading::before{
    content:'';
    height:100%;
    width:100%;
    position:absolute;
    top:0;
    left:0;
    background-color:rgba(213, 213, 213, 0.499);
    z-index:999;
    background-image: url(https://cdnjs.cloudflare.com/ajax/libs/timelinejs/2.25/css/loading.gif);
    background-size: auto;
    background-position: center;
    background-repeat: no-repeat;
}


.leaflet-control-habitat-place{
    cursor:pointer;
    background-color:white;
    font-size:1rem;
    color: var(--color-text);
    padding:0.5rem;
}
.leaflet-control-habitat-place.active {
    background-color: var(--color-primary);
    color:white;
}
</style>

    <main class="page-content page-content-full-width" id="main-content">
        <div id="map" class="loading" style="height:80vh; margin-bottom:2rem;"></div>

        <section>
            <h3>Our Wild Spaces 2.0 Report</h3>
            <ul>
                <li><a href="https://docs.naturehungry.sg/Our_Wild_Spaces_2.0.pdf">View the OWS 2.0 Report here!</a></li>
            </ul>
        </section>
    </main>



  <script>
            // Define strict boundaries around mainland Singapore and islands
            var southWest = L.latLng(0.900, 103.300);
            var northEast = L.latLng(1.700, 104.400);
            var singaporeBounds = L.latLngBounds(southWest, northEast);

            const map = L.map("map", {
                preferCanvas: true,
                center: [1.3521, 103.8198], // Center of Singapore
                zoom: 11,
                minZoom: 11, // Prevents zooming out past the island view
                maxBounds: singaporeBounds,
                maxBoundsViscosity: 0.2
            })
            // Load OpenStreetMap Tiles
            L.tileLayer(
                "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
                {
                    attribution:
                        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                    subdomains: "abcd",
                    maxZoom: 20,
                },
            ).addTo(map);

            const ows2NameColors = [
                "#aa002b", "#e76f51", "#f4a261", "#e9c46a", "#2a9d8f",
                "#277da1", "#577590", "#6a4c93", "#bc6c25", "#606c38",
            ];

            const ows2Articles = {
                {% for article in site.articles %}
                    {% if article.url contains '/OurWildSpaces2.0/' and article.title %}
                        {{ article.title | jsonify }}: {
                            title: {{ article.title | jsonify }},
                            url: {{ article.url | relative_url | jsonify }},
                            coverimg: {{ article.coverimg | default: "" | jsonify }}
                        },
                    {% endif %}
                {% endfor %}
            };

            fetch("/assets/geojson/OWS2.geojson")
                .then((response) => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .then((data) => {
                    const colorsByName = new Map(
                        [...new Set(data.features.map((feature) => feature.properties.NAME || "Unknown"))]
                            .sort()
                            .map((name, index) => [name, ows2NameColors[index]]),
                    );

                    const layer = L.geoJSON(data, {
                        style: (feature) => {
                            const name = feature.properties.NAME || "Unknown";
                            const color = colorsByName.get(name) || "#777777";
                            return {
                                color,
                                fillColor: color,
                                weight: 1,
                                opacity: 0.9,
                                fillOpacity: 0.45,
                            };
                        },
                        onEachFeature: (feature, layer) => {
                            const name = feature.properties.NAME || "Unknown space";
                            const article = ows2Articles[name];
                            const articleTitle = article?.title || name;
                            const articleLink = article?.url
                                ? `<p><a href="${article.url}">Read about this site</a></p>`
                                : "";
                            const preview = article?.coverimg
                                ? `<div class="habitat-popup-preview"><img src="${article.coverimg}" alt=""><h3>${name}</h3></div>`
                                : `<h3 class="habitat-popup-title">${articleTitle}</h3>`;
                            layer.bindPopup(`<div class="habitat-popup">${preview}${articleLink}</div>`, {
                                maxWidth: 250,
                                className: "habitat-popup-wrapper",
                                closeButton: true,
                            });
                        },
                    }).addTo(map);
                    map.fitBounds(layer.getBounds(), { padding: [20, 20] });
                    document.getElementById("map").classList.remove("loading");
                })
                .catch((error) => {
                    console.error("Error fetching OWS2 data:", error);
                    document.getElementById("map").classList.remove("loading");
                });

            
        </script>

{% include global/footer.html %}
