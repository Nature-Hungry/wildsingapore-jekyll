{% assign items = include.items %}
{% if include.height %}
{% assign height = include.height %}
{% else %}
{% assign height = 200 %}
{% endif %}
<div class="justifiedgallery">
{% for item in items %}
<div class="justifiedgallery-item">
        <img src="{{item.url}}" alt="" style="height:{{height}}px;">
    </div>
{% endfor %}
</div>
