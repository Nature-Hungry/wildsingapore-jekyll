
<div class="img-wrap-group">
    {% for item in include.items %}
    <div class="img-container">
        <img src="{{item.url}}" alt="{{item.caption | strip_html | escape }}" class="gallery-image">
        <div class="caption">
        {{item.caption}}
        </div>
    </div>
    {% endfor %}

</div>

<script>
    (() => {
        const createLightbox = () => {
            if (document.querySelector('.gallery-lightbox')) return;

            const lightbox = document.createElement('div');
            lightbox.className = 'gallery-lightbox';
            lightbox.setAttribute('aria-hidden', 'true');
            lightbox.innerHTML = `
                <button class="gallery-lightbox-close" type="button" aria-label="Close enlarged image">&times;</button>
                <img class="gallery-lightbox-image" alt="">
            `;
            document.body.appendChild(lightbox);

            const closeLightbox = () => {
                lightbox.classList.remove('is-open');
                lightbox.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('gallery-lightbox-open');
            };

            lightbox.addEventListener('click', (event) => {
                if (event.target === lightbox) closeLightbox();
            });

            document.addEventListener('click', (event) => {
                const galleryImage = event.target.closest('.gallery-image');
                if (galleryImage) {
                    lightbox.querySelector('.gallery-lightbox-image').src = galleryImage.src;
                    lightbox.querySelector('.gallery-lightbox-image').alt = galleryImage.alt;
                    lightbox.classList.add('is-open');
                    lightbox.setAttribute('aria-hidden', 'false');
                    document.body.classList.add('gallery-lightbox-open');
                    return;
                }

                if (event.target.closest('.gallery-lightbox-close')) {
                    closeLightbox();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
            });
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', createLightbox, { once: true });
        } else {
            createLightbox();
        }
    })();
</script>
