---
title: Reclamation in Singapore
---
{% include global/header.html %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
	.reclamation-map {
		position: relative;
		height: 80vh;
		min-height: 28rem;
		margin-bottom: 2rem;
	}
</style>

<main class="page-content page-content-full-width reclamation-page" id="main-content">
	<h1>Reclamation in Singapore</h1>
	<div id="map" class="reclamation-map loading" aria-label="Map of reclamation projects"></div>
</main>

<script>
	const map = L.map("map", {
		preferCanvas: true,
		center: [1.218951, 103.741054],
		zoom: 12,
		minZoom: 8,
		maxBounds: L.latLngBounds([0.900, 103.300], [1.700, 104.400]),
		maxBoundsViscosity: 0.2,
	});

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_26hm_1_304b9580a7cc66ecb19c3954', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd', maxZoom: 20
        }).addTo(map);

	const projectLinks = {
		"Changi Bay": "changibay",
		"Pasir Ris": "pasirris",
		"Tekong-Ubin": "tekong-ubin",
		"Tuas Megaport": "tuasmegaport",
		"Western Island": "westernisland",
		"Greater Southern Waterfront": "greatersouthernwaterfront",
		"Mandai Mangroves": "mandaimongroves",
		"Aviation Park": "aviationpark"
	};

	const gradientStops = [
		{ position: 0, color: [250, 204, 21] },
		{ position: 0.5, color: [249, 115, 22] },
		{ position: 1, color: [220, 38, 38] },
	];

	const colorForArea = (area, minimumArea, maximumArea) => {
		const range = maximumArea - minimumArea;
		const normalizedArea = range ? (area - minimumArea) / range : 0;
		const lowerStop = gradientStops.reduce((stop, currentStop) =>
			currentStop.position <= normalizedArea ? currentStop : stop
		);
		const upperStop = gradientStops.find((stop) => stop.position >= normalizedArea) || gradientStops.at(-1);
		const stopRange = upperStop.position - lowerStop.position;
		const ratio = stopRange ? (normalizedArea - lowerStop.position) / stopRange : 0;
		const color = lowerStop.color.map((channel, index) =>
			Math.round(channel + (upperStop.color[index] - channel) * ratio)
		);

		return `rgb(${color.join(", ")})`;
	};

	fetch("/assets/geojson/ReclamationProjects.geojson")
		.then((response) => {
			if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
			return response.json();
		})
		.then((data) => {
			const projectAreas = data.features.reduce((totals, feature) => {
				const project = feature.properties || {};
				const name = project.NAME || "Reclamation project";
				const area = Number(project.SHAPE_AREA);

				if (Number.isFinite(area)) {
					totals[name] = (totals[name] || 0) + area;
				}

				return totals;
			}, {});
			const areaValues = data.features
				.map((feature) => Number(feature.properties?.SHAPE_AREA))
				.filter((area) => Number.isFinite(area));
			const minimumArea = Math.min(...areaValues);
			const maximumArea = Math.max(...areaValues);

			const projectLayer = L.geoJSON(data, {
				style: (feature) => {
					const area = Number(feature.properties?.SHAPE_AREA);

					return {
						color: "#374151",
						weight: 1,
						fillColor: Number.isFinite(area)
							? colorForArea(area, minimumArea, maximumArea)
							: "#9ca3af",
						fillOpacity: 0.65,
					};
				},
				onEachFeature: (feature, layer) => {
					const project = feature.properties || {};
					const name = project.NAME || "Reclamation project";
					const totalArea = projectAreas[name];
					const areaLabel = Number.isFinite(totalArea) ? Math.round(totalArea).toLocaleString() : "Unavailable";
					const slug = projectLinks[name];
					const readMore = slug
						? `<a href="/reclamation/${slug}/">Read more...</a>`
						: "";

					layer.bindPopup(`
						<div class="reclamation-popup">
							<h3>${name}</h3>
							<p>Land Area: ${areaLabel} hectares</p>
							${readMore}
						</div>
					`, {
						maxWidth: 250,
						className: "habitat-popup-wrapper",
						closeButton: true,
					});
				},
			}).addTo(map);

			map.fitBounds(projectLayer.getBounds(), { padding: [20, 20] });
			document.getElementById("map").classList.remove("loading");
		})
		.catch((error) => {
			console.error("Error fetching reclamation project data:", error);
			document.getElementById("map").classList.remove("loading");
		});
</script>
